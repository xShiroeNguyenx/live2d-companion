name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs sync:core and build:framework-types, so the vendored
      # SDK is prepared as a side effect of installing.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Ubuntu 24.04 runners ship xvfb but not the desktop libraries Electron
      # links against, so the binary dies on startup before it prints anything
      # — the job failed in one second with a bare exit code 1.
      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xauth \
            libatk-bridge2.0-0 libdrm2 libgbm1
          # ALSA was renamed in Ubuntu 24.04 (the 64-bit time_t transition), so
          # accept either name rather than pinning the job to one release.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      # Chromium's SUID sandbox helper has to be root-owned with the setuid bit,
      # but npm unpacks it as the runner user. Electron then aborts before doing
      # anything: "The SUID sandbox helper binary was found, but is not
      # configured correctly" — the message goes on to state the ownership it
      # wants, which is what these two commands give it.
      #
      # Granting the permissions rather than passing --no-sandbox keeps the smoke
      # test running under the same sandboxing the shipped app uses; disabling it
      # would let a sandbox-related regression through unnoticed.
      - name: Fix Chromium sandbox permissions
        run: |
          sandbox=node_modules/electron/dist/chrome-sandbox
          if [ ! -f "$sandbox" ]; then
            echo "::error::$sandbox not found — Electron's layout changed?"
            ls -la node_modules/electron/dist | head -20
            exit 1
          fi
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      # Electron needs an X server even with `show: false`, and the driver
      # already enables SwiftShader for machines with no GPU.
      #
      # Retried because the run is known to be intermittently flaky (~1 in 8 on
      # a fast machine): the expression-capture step occasionally sees the
      # default pose instead of the posed one. Tracked in ROADMAP.md under
      # technical debt. `continue-on-error` is deliberately NOT used — a run
      # that fails twice is a real signal and should fail the build.
      - name: Smoke test
        run: xvfb-run --auto-servernum npm run smoke || xvfb-run --auto-servernum npm run smoke

      # The driver writes a capture of the rendered model; keeping it makes a
      # rendering regression visible without reproducing the run locally.
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-capture
          path: .smoke/
          if-no-files-found: ignore
          retention-days: 7
